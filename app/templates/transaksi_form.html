<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Transaksi</title>
</head>
<body>
  <h3>Transaksi untuk {{ pelanggan.nama_pelanggan }}</h3>
  <form method="POST">
    <label>Jenis Transaksi:</label><br>
    <select name="tipe" required>
      <option value="pembelian">Pembelian</option>
      <option value="topup">Top Up</option>
    </select><br><br>

    <label>Nominal (Rp):</label><br>
    <input type="number" name="nominal" min="100" required><br><br>

    <label>Keterangan (opsional):</label><br>
    <input type="text" name="keterangan"><br><br>

    <button type="submit">Simpan Transaksi</button>
  </form>

  <br>
  <a href="{{ url_for('tapping.show_tapping', uid=pelanggan.uid_rfid) }}">Kembali</a>
</body>
</html>
